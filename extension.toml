id             = "actionlint"
name           = "actionlint"
version        = "0.1.0"
schema_version = 1
authors        = ["Kaj Kowalski"]
description    = "GitHub Actions diagnostics, expression completions, and quick fixes using actionlint."
repository     = "https://github.com/kjanat/zed-actionlint"

[language_servers.actionlint]
name      = "actionlint"
languages = ["GitHub Actions"]

[language_servers.actionlint.language_ids]
"GitHub Actions" = "yaml"

# Check local and downloaded binaries for LSP support.
[[capabilities]]
kind    = "process:exec"
command = "*"
args    = ["lsp", "--help"]

[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["kjanat", "actionlint", "releases", "download", "**"]
